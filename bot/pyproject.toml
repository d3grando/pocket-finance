[project]
name = "pocket-bot"
version = "1.0.0"
description = "Pocket Finance Telegram bot (aiogram 3, long polling) — HTTP client of the backend"
license = "MIT"
requires-python = ">=3.12,<3.13"
# NB: aiogram 3.31 requires pydantic <2.14 — the bot is a separate package for this reason.
dependencies = [
    "aiogram==3.31.0",
    "httpx==0.28.1",
    "pydantic-settings==2.16.1",
    "tzdata==2026.5",  # zoneinfo in slim images (Asia/Ho_Chi_Minh)
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "respx==0.23.1",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pocket_bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
